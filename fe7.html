                document.getElementById("excludeSeth").checked;
            const guaranteeLegends =
                document.getElementById("guaranteeLegends").checked;
            

        if (route === "randoRoute") {
            const routes = [
                "lynEliwoodRoute",
                "lynHectorRoute",
                "eliwoodRoute",
                "hectorRoute"
            ];
        
            actualRoute = routes[Math.floor(Math.random() * routes.length)];
        
            const routeNames = {
                lynEliwoodRoute: "Lyn's Tale + Eliwood's Tale",
                lynHectorRoute: "Lyn's Tale + Hector's Tale",
                eliwoodRoute: "Eliwood's Tale Only",
                hectorRoute: "Hector's Tale Only"
            };
        
            routeText = `Randomized Route: ${routeNames[actualRoute]}`;
        }


            // shuffle array using the Fisher-Yates method.
            let pool = [...sacredStonesAll];


// Where all the filters should be going: Below this.
            if (unpromotedOnly) {
                pool = pool.filter(
                    unit => unit.promotions !== "None"
                );
            }
            
            if (excludeSeth) {
                pool = pool.filter(
                    unit => unit.name !== "Seth"
                );
            }

            // Remove Hector-exclusive characters from Eliwood routes
            if (actualRoute === "lynEliwoodRoute" || actualRoute === "eliwoodRoute") {
                pool = pool.filter(
                    unit => unit.name !== "Farina" && unit.name !== "Karla"
                );
            }
            
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

           
             // take 7 unique characters
            let selected = [];

            if (guaranteeLegends) {

                // One unit from each legendary pool
                legendaryPools.forEach(poolInfo => {

                    const candidates = pool.filter(unit =>
                        unit.tags &&
                        unit.tags.includes(poolInfo.tag) &&
                        !selected.some(chosen => chosen.name === unit.name)
                    );
    
                    if (candidates.length > 0) {
                        const chosen = {
                            ...candidates[Math.floor(Math.random() * candidates.length)],
                            legendaryWeapon: poolInfo.weapon
                        };

                        selected.push(chosen);
                    }

                });

                // Fill remaining slots randomly
                const remaining = pool.filter(unit =>
                    !selected.some(chosen => chosen.name === unit.name)
                );

                for (let i = remaining.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
                }

                selected.push(...remaining.slice(0, 7 - selected.length));

            }
            else {

                selected = pool.slice(0, 7);

            }

            if (actualRoute === "lynEliwoodRoute") {
                selected.sort((a, b) => a.lynEliwoodOrder - b.lynEliwoodOrder);
            } else if (actualRoute === "lynHectorRoute") {
                selected.sort((a, b) => a.lynHectorOrder - b.lynHectorOrder);
            } else if (actualRoute === "eliwoodRoute") {
                selected.sort((a, b) => a.eliwoodOrder - b.eliwoodOrder);
            } else if (actualRoute === "hectorRoute") {
                selected.sort((a, b) => a.hectorOrder - b.hectorOrder);
            }

            const output = selected.map(unit => {
                let chapter;

                if (actualRoute === "lynEliwoodRoute") {
                    chapter = unit.recruitmentLynEliwood;
                } else if (actualRoute === "lynHectorRoute") {
                    chapter = unit.recruitmentLynHector;
                } else if (actualRoute === "eliwoodRoute") {
                    chapter = unit.recruitmentEliwood;
                } else if (actualRoute === "hectorRoute") {
                    chapter = unit.recruitmentHector;
                }

                const randomizePromotions =
                document.getElementById("randoPromotions").checked;

                let displayedClass = unit.startingClass;

                if (randomizePromotions) {
                    if (Array.isArray(unit.promotions) && unit.promotions.length > 0) {
                        displayedClass =
                            unit.promotions[Math.floor(Math.random() * unit.promotions.length)];
                    }
                }

                const displayName = randomizePromotions
                    ? `${unit.name} (${displayedClass})`
                    : unit.name;



                const legendaryText =
                     guaranteeLegends && unit.legendaryWeapon
                        ? ` - ${unit.legendaryWeapon}`
                        : "";

                return `
                        <div class="characterBox">
                            <img class="characterPortrait" src="${unit.image}" alt="${unit.name}">
                            
                            <div class="characterInfo">
                                <strong>${displayName}${legendaryText}</strong><br>
                                - Recruited In: ${chapter}<br>
                                - Starting Class: ${unit.startingClass}
                            </div>
                        </div>
                    `;
            }).join("");

            document.getElementById("result").innerHTML = `
                ${routeText ? `<strong>${routeText}</strong><br><br>` : ""}
                ${output}
            `;
        }

        function generatePools() {
          const tags = [
            "SwordPool", "SwordPoolRec",
            "AxePool", "AxePoolRec",
            "LancePool", "LancePoolRec",
            "BowPool", "BowPoolRec",
            "AnimaPool", "AnimaPoolRec",
            "LightPool", "LightPoolRec",
            "DarkPool", "DarkPoolRec",
            "StaffPool", "StaffPoolRec"
          ];

          const output = document.getElementById("result");
          output.innerHTML = ""; // removes all prior output

          tags.forEach(tag => {
            const header = document.createElement("h3");
            header.textContent = tag;
            output.appendChild(header);

            sacredStonesAll.forEach(char => {
              if (char.tags && char.tags.includes(tag)) {
                const line = document.createElement("div");
                line.textContent = char.name;
                output.appendChild(line);
              }
            });
          });
        }
    </script>

  </body>
</html>
