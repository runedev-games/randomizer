            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        }

            width: 225px;
            margin-bottom: 1px;
        }

        function createCharacterBox(unit, actualRoute) {
            let chapter;
        
            if (actualRoute === "lynEliwoodRoute") {
                chapter = unit.recruitmentLynEliwood;
            } else if (actualRoute === "lynHectorRoute") {
                chapter = unit.recruitmentLynHector;
            } else if (actualRoute === "eliwoodRoute") {
                chapter = unit.recruitmentEliwood;
            } else if (actualRoute === "hectorRoute") {
                chapter = unit.recruitmentHector;
            }
        
            const boxClass = unit.required
                ? "characterBox requiredCharacterBox"
                : "characterBox";
        
            return `
                <div class="${boxClass}">
                    ${unit.images
                        ? `
                            <div class="characterPortraitPair">
                                <img class="characterPortrait" src="${unit.images[0]}" alt="${unit.name}">
                                <img class="characterPortrait" src="${unit.images[1]}" alt="${unit.name}">
                            </div>
                          `
                        : `
                            <img class="characterPortrait" src="${unit.image}" alt="${unit.name}">
                          `
                    }
                    
                    <div class="characterInfo">
                        <strong>${unit.name}</strong><br>
                        - Recruited In: ${chapter}<br>
                        - Starting Class: ${
                            unit.startingClasses
                                ? unit.startingClasses.join(" / ")
                                : unit.startingClass
                        }
                    </div>
                </div>
            `;
        }

        function updateBanChoices() {
            const route = document.getElementById("routeSelect").value;
        
            let banPool = blazingBladeAll.filter(unit => !unit.required);
        
            // Remove Hector-exclusive characters from Eliwood routes
            if (route === "lynEliwoodRoute" || route === "eliwoodRoute") {
                banPool = banPool.filter(
                    unit => unit.name !== "Farina" && unit.name !== "Karla"
                );
            }
        
            const banSelects = [
                document.getElementById("ban1"),
                document.getElementById("ban2"),
                document.getElementById("ban3")
            ];
        
            const currentSelections = banSelects.map(select => select.value);
        
            banSelects.forEach((select, index) => {
                const currentValue = currentSelections[index];
        
                select.innerHTML = '<option value="">No Ban</option>';
        
                banPool.forEach(unit => {
                    const alreadySelectedElsewhere = currentSelections.some(
                        (name, otherIndex) =>
                            otherIndex !== index && name === unit.name
                    );
        
                    if (!alreadySelectedElsewhere) {
                        const option = document.createElement("option");
                        option.value = unit.name;
                        option.textContent = unit.name;
        
                        if (unit.name === currentValue) {
                            option.selected = true;
                        }
        
                        select.appendChild(option);
                    }
                });
            });
        }

        document.getElementById("ban1").addEventListener("change", updateBanChoices);
        document.getElementById("ban2").addEventListener("change", updateBanChoices);
        document.getElementById("ban3").addEventListener("change", updateBanChoices);
        
        document.getElementById("routeSelect").addEventListener("change", updateBanChoices);
        
        updateBanChoices();
    
        function generateCharacter() {
            const route = document.getElementById("routeSelect").value;

            const ban1 = document.getElementById("ban1").value;
            const ban2 = document.getElementById("ban2").value;
            const ban3 = document.getElementById("ban3").value;
            
            const bannedUnits = [ban1, ban2, ban3].filter(name => name !== "");

            let actualRoute = route;
            let routeText = "";
            const unpromotedOnly =
                document.getElementById("unpromotedOnly").checked;
            // const guaranteeLegends =
                // document.getElementById("guaranteeLegends").checked;
            

        if (route === "randoRoute") {
            const routes = [
                "lynEliwoodRoute",
                "lynHectorRoute",
                "eliwoodRoute",
                "hectorRoute"
            ];
        
            actualRoute = routes[Math.floor(Math.random() * routes.length)];
        
            const routeNames = {
                lynEliwoodRoute: "Lyn's Tale + Eliwood's Tale",
                lynHectorRoute: "Lyn's Tale + Hector's Tale",
                eliwoodRoute: "Eliwood's Tale Only",
                hectorRoute: "Hector's Tale Only"
            };
        
            routeText = `Randomized Route: ${routeNames[actualRoute]}`;
        }


            // shuffle array using the Fisher-Yates method.
            let pool = [...blazingBladeAll];


// Where all the filters should be going: Below this.
            if (unpromotedOnly) {
                pool = pool.filter(
                    unit => unit.promotions !== "None"
                );
            }
            

            // Remove Hector-exclusive characters from Eliwood routes
            if (actualRoute === "lynEliwoodRoute" || actualRoute === "eliwoodRoute") {
                pool = pool.filter(
                    unit => unit.name !== "Farina" && unit.name !== "Karla"
                );
            }

            // Remove banned units
            pool = pool.filter(unit => !bannedUnits.includes(unit.name));
            
            // Shuffle array using the Fisher-Yates method
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

           
             // take 7 unique characters
           let selected = [];

           selected = pool.slice(0, 7);

            if (actualRoute === "lynEliwoodRoute") {
                selected.sort((a, b) => a.lynEliwoodOrder - b.lynEliwoodOrder);
            } else if (actualRoute === "lynHectorRoute") {
                selected.sort((a, b) => a.lynHectorOrder - b.lynHectorOrder);
            } else if (actualRoute === "eliwoodRoute") {
                selected.sort((a, b) => a.eliwoodOrder - b.eliwoodOrder);
            } else if (actualRoute === "hectorRoute") {
                selected.sort((a, b) => a.hectorOrder - b.hectorOrder);
            }

        // I removed const output here.

        let sortedRequired = [...requiredCharacters];
        
        if (actualRoute === "lynEliwoodRoute") {
            sortedRequired.sort((a, b) => a.lynEliwoodOrder - b.lynEliwoodOrder);
        } else if (actualRoute === "lynHectorRoute") {
            sortedRequired.sort((a, b) => a.lynHectorOrder - b.lynHectorOrder);
        } else if (actualRoute === "eliwoodRoute") {
            sortedRequired.sort((a, b) => a.eliwoodOrder - b.eliwoodOrder);
        } else if (actualRoute === "hectorRoute") {
            sortedRequired.sort((a, b) => a.hectorOrder - b.hectorOrder);
        }
        
        const requiredOutput = `
            <div class="characterGrid">
                ${sortedRequired
                    .map(unit => createCharacterBox(unit, actualRoute))
                    .join("")}
            </div>
        `;
        
        const randomOutput = `
            <div class="characterGrid">
                ${selected
                    .map(unit => createCharacterBox(unit, actualRoute))
                    .join("")}
            </div>
        `;
        
        document.getElementById("result").innerHTML = `
            ${routeText ? `<strong>${routeText}</strong><br><br>` : ""}
        
            <h2>Required Units</h2>
            ${requiredOutput}
        
            <h2>Randomization Results</h2>
            ${randomOutput}
        `;

        
       }
